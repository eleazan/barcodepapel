# Nixpacks configuration — alternative to Dockerfile for Coolify
# Use this file instead of Dockerfile if you select "Nixpacks" as build pack in Coolify.
# Delete this file if you're using the Dockerfile.

[phases.setup]
nixPkgs = [
  "php83",
  "php83Extensions.pdo",
  "php83Extensions.pdo_mysql",
  "php83Extensions.pdo_pgsql",
  "php83Extensions.mbstring",
  "php83Extensions.exif",
  "php83Extensions.bcmath",
  "php83Extensions.gd",
  "php83Extensions.zip",
  "php83Extensions.intl",
  "php83Extensions.opcache",
  "php83Extensions.redis",
  "php83Extensions.pcntl",
  "nodejs_20",
  "nodePackages.npm",
]

[phases.install]
cmds = [
  "composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader",
  "npm ci --frozen-lockfile",
]

[phases.build]
cmds = [
  "npm run build",
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache",
  "php artisan event:cache",
]

[start]
cmd = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
